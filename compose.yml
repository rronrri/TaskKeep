name: taskkeep

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: taskkeep-empresarial:latest
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
