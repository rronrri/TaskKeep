services:
  app:
    build:
      target: development
    image: taskkeep-empresarial:dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - taskkeep_node_modules:/app/node_modules
      - taskkeep_next_cache:/app/.next
    restart: "no"
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0"]

volumes:
  taskkeep_node_modules:
  taskkeep_next_cache:
